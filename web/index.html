<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>라멘 비전 봇</title>
<style>
  :root {
    --bg: #faf6f0; --card: #ffffff; --ink: #2b2118; --muted: #7a6a5c; --line: #eadfd2;
    --accent: #c2410c; --accent-soft: #fdeee4; --chip: #f3ebe1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1512; --card: #241d18; --ink: #f2e9df; --muted: #b3a393; --line: #3a2f27;
      --accent: #fb923c; --accent-soft: #3a2517; --chip: #2f2620;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    line-height: 1.6;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  header h1 { margin: 0; font-size: 1.7rem; }
  header p { margin: 4px 0 24px; color: var(--muted); }

  #drop {
    display: block; border: 2px dashed var(--line); border-radius: 16px; background: var(--card);
    padding: 28px 16px; text-align: center; cursor: pointer; transition: border-color .15s, background .15s;
  }
  #drop.over, #drop:hover { border-color: var(--accent); background: var(--accent-soft); }
  #drop strong { color: var(--accent); }
  #drop small { display: block; color: var(--muted); margin-top: 4px; }
  #file { display: none; }

  #preview { display: none; margin-top: 16px; width: 100%; max-height: 420px; object-fit: contain;
             border-radius: 12px; background: var(--card); }

  #status { margin: 16px 0 0; color: var(--muted); min-height: 1.6em; }
  .spinner { display: inline-block; width: 14px; height: 14px; margin-right: 6px; vertical-align: -2px;
             border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%;
             animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { color: #dc2626; }

  #result { display: none; margin-top: 16px; background: var(--card); border: 1px solid var(--line);
            border-radius: 16px; padding: 24px; }
  .label { font-size: .8rem; color: var(--muted); letter-spacing: .02em; }
  #title { margin: 2px 0 8px; font-size: 1.5rem; color: var(--accent); }
  #summary { margin: 0 0 20px; }
  #summary p, section p { margin: 0 0 6px; }
  section { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
  section h3 { margin: 0 0 6px; font-size: 1rem; }
  section ul { margin: 0; padding-left: 20px; }
  li.sub { margin-left: 20px; list-style: circle; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: .85rem; }
  .chip.on { background: var(--accent); color: #fff; }
  a { color: var(--accent); word-break: break-all; }
  details { margin-top: 14px; color: var(--muted); font-size: .85rem; }
  details pre { white-space: pre-wrap; word-break: break-word; background: var(--chip); padding: 10px;
                border-radius: 8px; }
  footer { margin-top: 32px; color: var(--muted); font-size: .8rem; text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>🍜 라멘 비전 봇</h1>
    <p>라멘 사진을 올리면 종류를 알려 드려요. 전부 내 PC의 로컬 모델로 돌아가요.</p>
  </header>

  <label id="drop" for="file">
    <strong>사진 선택</strong> 또는 여기로 끌어다 놓기
    <small>JPG · PNG · 최대 20MB</small>
  </label>
  <input id="file" type="file" accept="image/*">
  <img id="preview" alt="올린 사진 미리보기">
  <p id="status"></p>

  <article id="result">
    <div class="label">이 라멘은</div>
    <h2 id="title"></h2>
    <p id="summary"></p>

    <section>
      <h3>👀 사진에서 본 것</h3>
      <ul id="observed"></ul>
    </section>
    <section>
      <h3>📖 이렇게 구분해요</h3>
      <div id="criteria"></div>
    </section>
    <section id="origin-wrap">
      <h3>🏮 유래</h3>
      <div id="origin"></div>
    </section>
    <section>
      <h3>🔎 비교한 후보</h3>
      <div class="chips" id="candidates"></div>
    </section>
    <section>
      <h3>📚 출처</h3>
      <ul id="sources"></ul>
    </section>

    <details>
      <summary>개발자용 정보</summary>
      <pre id="debug"></pre>
    </details>
  </article>

  <footer>qwen2.5vl:7b (Vision) · bge-m3 + Chroma (RAG) · Ollama</footer>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const drop = $("drop"), fileInput = $("file");

  // 지식 문서의 마크다운 조각(- 목록, **굵게**)만 간단히 HTML로 바꾼다. 먼저 이스케이프해서 HTML 주입을 막는다
  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  }
  function mdLite(text) {
    const lines = escapeHtml(text || "").replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").split("\n");
    // 앞에 공백이 있는 "  - " 줄은 하위 항목으로 들여쓴다
    const items = lines.filter((l) => /^\s*- /.test(l))
      .map((l) => `<li${/^\s+- /.test(l) ? ' class="sub"' : ""}>${l.replace(/^\s*- /, "")}</li>`);
    const plain = lines.filter((l) => l.trim() && !/^\s*- /.test(l)).map((l) => `<p>${l}</p>`);
    return plain.join("") + (items.length ? `<ul>${items.join("")}</ul>` : "");
  }

  ["dragenter", "dragover"].forEach((e) => drop.addEventListener(e, (ev) => { ev.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach((e) => drop.addEventListener(e, (ev) => { ev.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", (ev) => { if (ev.dataTransfer.files[0]) analyze(ev.dataTransfer.files[0]); });
  fileInput.addEventListener("change", () => { if (fileInput.files[0]) analyze(fileInput.files[0]); });

  async function analyze(file) {
    $("preview").src = URL.createObjectURL(file);
    $("preview").style.display = "block";
    $("result").style.display = "none";
    $("status").className = "";
    $("status").innerHTML = '<span class="spinner"></span>분석 중이에요… (보통 5~10초, 첫 실행은 모델 로딩 때문에 더 걸려요)';

    const form = new FormData();
    form.append("file", file);
    try {
      const res = await fetch("/api/identify", { method: "POST", body: form });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || res.statusText);
      if (!data.ok) throw new Error(data.message);
      render(data);
      $("status").textContent = `분석 완료 (${data.seconds}초)`;
    } catch (err) {
      $("status").className = "error";
      $("status").textContent = "오류: " + err.message;
    }
  }

  function render(d) {
    $("title").textContent = d.title;
    $("summary").innerHTML = mdLite(d.summary);
    $("observed").innerHTML = d.observed.map((o) => `<li>${escapeHtml(o)}</li>`).join("");
    $("criteria").innerHTML = mdLite(d.criteria);
    $("origin-wrap").style.display = d.origin ? "" : "none";
    $("origin").innerHTML = mdLite(d.origin);
    $("candidates").innerHTML = d.candidates
      .map((c) => `<span class="chip ${c.style === d.style ? "on" : ""}">${escapeHtml(c.title)}</span>`).join("");
    $("sources").innerHTML = d.sources
      .map((s) => `<li><a href="${escapeHtml(s.url)}" target="_blank" rel="noopener">${escapeHtml(s.label)}</a></li>`).join("");
    $("debug").textContent = JSON.stringify({ style: d.style, reason_en: d.reason_en, features: d.features }, null, 2);
    $("result").style.display = "block";
  }
</script>
</body>
</html>
